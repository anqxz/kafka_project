# Kroxylicious pass-through proxy on :9192.
# Upstream: mTLS to brokers on :9096 with the kroxylicious leaf.
# Downstream: TLS server for clients; same keystore.
management:
  endpoints:
    prometheus: {}

virtualClusters:
  - name: kafka-kraft-cluster
    targetCluster:
      bootstrapServers: broker1:9096,broker2:9096,broker3:9096
      tls:
        trust:
          storeFile: /certs/jks/kroxylicious/truststore.p12
          storePassword:
            passwordFile: /etc/kroxylicious/tls-password
          storeType: PKCS12
        key:
          storeFile: /certs/jks/kroxylicious/keystore.p12
          storePassword:
            passwordFile: /etc/kroxylicious/tls-password
          storeType: PKCS12
    gateways:
      - name: kroxylicious
        portIdentifiesNode:
          bootstrapAddress: broker.events.local:9192
          nodeIdRanges:
            - name: default
              start: 4
              end: 6
        tls:
          key:
            storeFile: /certs/jks/kroxylicious/keystore.p12
            storePassword:
              passwordFile: /etc/kroxylicious/tls-password
            storeType: PKCS12
    logNetwork: false
    logFrames: false

filterDefinitions: []
